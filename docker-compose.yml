
services:
  postgres:
    image: postgres:17
    container_name: sales-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_intelligence
      POSTGRES_USER: sales_admin
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_admin -d sales_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
